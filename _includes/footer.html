<!-- Footer -->
<footer>
    <div class="container">
        <div class="row">
            <div class="col-md-8">
                <ul class="list-inline">
                    <li>
                        <a href="#home">Inicio</a>
                    </li>
                    <li class="footer-menu-divider">&sdot;</li>
                    <li>
                        <a href="#about">Enfoque</a>
                    </li>
                    <li class="footer-menu-divider">&sdot;</li>
                    <li>
                        <a href="#services">Servicios</a>
                    </li>
                    <li class="footer-menu-divider">&sdot;</li>
                    <li>
                        <a href="#contact">Diagnóstico</a>
                    </li>
                </ul>
                <p class="copyright text-muted small">{{ site.copyright }}</p>
            </div>
            <div class="col-md-4 text-right">
                <ul class="list-inline" style="margin-bottom: 5px;">
                    {% for social in site.social %}
                    <li>
                        <a href="{{ social.url }}" target="_blank" rel="noopener noreferrer" title="{{ social.title | capitalize }}">
                            <i class="fa fa-{{ social.title }} fa-lg"></i>
                        </a>
                    </li>
                    {% endfor %}
                </ul>
                <p class="text-muted small" style="margin-bottom: 0;">{{ site.credits }}</p>
            </div>
        </div>
    </div>
</footer>
